          schema:
            $ref: '../_schemas.yaml#/common201'
    '400':
      description: Invalid parameter supplied
      content:
        application/json:
          schema:
            $ref: '../_schemas.yaml#/common400'
    '401':
      description: Unauthorized / Invalid Token / Token has expired / Wrong token
      content:
        application/json:
          schema:
            $ref: '../_schemas.yaml#/common401'
    '404':
      description: Data not found
      content:
        application/json:
          schema:
            $ref: '../_schemas.yaml#/common404'
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '../_schemas.yaml#/common409'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '../_schemas.yaml#/common500'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../_schemas.yaml#/vocabularyGroupPostReq'
    required: true
  security:
    - tokenAuth: []

