type: object
properties:
  email:
    type: string
    example: 'email.domain.com'
    minLength: 6
    maxLength: 20
  password:
    type: string
    example: 'password'
    minLength: 6
  otp:
    type: string
    example: '123456'
  device_id:
    type: string
    example: 'ROG123'
required:
  - email
  - password
  - otp
  - device_id
