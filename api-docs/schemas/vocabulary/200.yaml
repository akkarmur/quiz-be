type: object
properties:
  message:
    type: string
    example: 'Ok'
  data:
    type: object
    properties:
      totalCount:
        type: integer
        example: 1
      data:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              example: 101
            vocab_group_id:
              type: integer
              example: 12
            word:
              type: string
              example: 'こんにちは'
            language:
              type: string
              example: 'Japanese'
            note_word:
              type: string
              example: 'Greeting'
            image:
              type: string
              example: 'http://www.example.com/image.png'
            meaning:
              type: string
              example: 'Hello'
            pronunciation:
              type: string
              example: 'Kon-ni-chi-wa'
            note_meaning:
              type: string
              example: 'Used to greet people during the day'
            level:
              type: integer
              example: 1
            type:
              type: string
              example: 'noun'
            is_active:
              type: boolean
              example: true
            created_at:
              type: string
              format: date-time
              example: '2023-12-09T17:12:15.000Z'
            updated_at:
              type: string
              format: date-time
              example: '2023-12-09T17:12:15.000Z'
            user_vocabulary_score:
              type: object
              properties:
                user_id:
                  type: integer
                  example: 1
                attempt_count:
                  type: integer
                  example: 1
                score:
                  type: integer
                  example: 10
              required:
                - user_id
          required:
            - id
            - vocab_group_id
            - word
            - language
            - meaning
            - pronunciation
            - created_at
            - updated_at
    required:
      - totalCount
      - data
required:
  - message
  - data
