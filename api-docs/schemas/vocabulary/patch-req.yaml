type: object
properties:
  id:
    type: integer
    example: 12
  word:
    type: string
    example: 'こんにちは'
  language:
    type: string
    example: 'Japanese'
  note_word:
    type: string
    example: '今日は'
  meaning:
    type: string
    example: 'Hello'
  pronunciation:
    type: string
    example: 'Kon-ni-chi-wa'
  note_meaning:
    type: string
    example: 'Used to greet people during the day'
  level:
    type: integer
    example: 1
  type:
    type: string
    example: 'noun'
  image:
    type: file
required:
  - id
